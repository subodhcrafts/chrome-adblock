<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked: dangerous site</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #b71c1c; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; padding: 32px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    .host { font-family: ui-monospace, monospace; background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 4px; word-break: break-all; }
    .why { opacity: .9; margin: 12px 0 28px; }
    button { padding: 10px 18px; border-radius: 6px; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 10px; }
    #back { background: #fff; color: #b71c1c; }
    #proceed { background: transparent; color: #fff; text-decoration: underline; padding-left: 0; }
  </style>
</head>
<body>
  <main>
    <h1>⚠ Dangerous or scam site blocked</h1>
    <p>Simple AdBlock stopped you from opening <span class="host" id="host"></span></p>
    <p class="why" id="why"></p>
    <button id="back">Get me out of here</button>
    <button id="proceed">Open anyway (trust this site)</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
